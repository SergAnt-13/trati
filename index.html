<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Траты">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; manifest-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>Траты</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1c1d21;--mut:#80848d;--ac:#4f7cff;--inc:#2e9e6b;--bd:#e7e9ee;--del:#c9504a}
@media (prefers-color-scheme:dark){:root{--bg:#0e0f12;--card:#17191d;--tx:#eceef2;--mut:#8b909a;--bd:#262a31;--ac:#6b93ff;--inc:#45c08a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;padding-top:env(safe-area-inset-top)}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px 96px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px}
.mut{color:var(--mut);font-size:13px}.inc{color:var(--inc)}
input{width:100%;font:inherit;color:var(--tx);background:transparent;border:1px solid var(--bd);border-radius:12px;padding:11px}
#amt{font-size:40px;font-weight:600;text-align:center;border:none;padding:6px 0;letter-spacing:-.5px}
.seg{display:flex;background:var(--bd);border-radius:11px;padding:2px;margin-bottom:10px}
.seg button{flex:1;border:none;background:none;padding:8px 4px;border-radius:9px;font:inherit;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.chip{border:1px solid var(--bd);background:none;color:var(--tx);border-radius:14px;padding:9px 2px;font:inherit;font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chip span{display:block;font-size:21px}.chip.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent)}
.main{width:100%;margin-top:10px;background:var(--ac);color:#fff;border:none;border-radius:14px;padding:14px;font:inherit;font-weight:600;font-size:16px}
.btn{width:100%;text-align:left;background:none;color:var(--tx);border:none;border-top:1px solid var(--bd);padding:13px 2px;font:inherit}
.btn:first-of-type{border-top:none}.btn small{display:block;color:var(--mut)}
.nav{display:flex;align-items:center;margin-bottom:10px}.nav b{flex:1;text-align:center;font-weight:600}
.nav button{background:none;border:none;color:var(--ac);font-size:24px;padding:0 14px}
.big{font-size:34px;font-weight:700;letter-spacing:-.5px}
.two{display:flex;gap:24px;margin:6px 0}.two b{display:block;font-size:18px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
.row:first-child{border-top:none}.row .i{font-size:21px}.row .m{flex:1;min-width:0}.row small{display:block;color:var(--mut)}.row .a{font-weight:600}
.x{background:none;border:none;color:var(--mut);font-size:16px;padding:4px 8px}
.bar{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:14px}
.bar .l{width:112px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .t{flex:1;height:6px;background:var(--bd);border-radius:3px;overflow:hidden}.bar .t i{display:block;height:100%;background:var(--ac)}
.bar .t i.g{background:var(--inc)}.bar .v{width:78px;text-align:right}
.chart{display:flex;align-items:flex-end;gap:2px;height:110px;margin-top:6px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.col .bb{display:flex;align-items:flex-end;gap:1px;width:100%;height:92px;justify-content:center}
.col .bb i{display:block;width:45%;background:var(--ac);border-radius:2px 2px 0 0;min-height:0}.col .bb i.g{background:var(--inc)}
.col em{font-style:normal;font-size:9px;color:var(--mut);height:16px;line-height:16px;white-space:nowrap}
h3{font-size:13px;font-weight:600;color:var(--mut);margin:0 0 8px;text-transform:uppercase;letter-spacing:.4px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1;background:none;border:none;color:var(--mut);font:inherit;font-size:11px;padding:4px}.tabs button span{display:block;font-size:20px}
.tabs button.on{color:var(--ac)}
.add{display:flex;gap:6px;margin-top:8px}
#undo{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}#undo b{text-decoration:underline}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none}
</style>
</head>
<body><div class="wrap">
<div id="nav" style="display:none"><div class="nav"><button id="prev">‹</button><b id="per"></b><button id="next">›</button></div><div class="seg" id="modes"></div></div>

<section id="t-add">
 <div class="card">
  <div class="seg" id="types"></div>
  <input id="amt" inputmode="decimal" placeholder="0" autocomplete="off">
  <div class="chips" id="chips"></div>
  <input id="note" placeholder="Заметка" autocomplete="off">
  <input id="dt" type="date" style="margin-top:8px">
  <button class="main" id="add">Записать</button>
 </div>
</section>
<section id="t-ov" style="display:none"></section>
<section id="t-hi" style="display:none"><div class="card" id="list"></div></section>
<section id="t-more" style="display:none">
 <div class="card"><h3>Выгрузка</h3>
  <button class="btn" id="csvP">CSV за выбранный период<small id="csvPl"></small></button>
  <button class="btn" id="csvA">CSV за всё время</button>
  <button class="btn" id="cpAI">Скопировать для ИИ<small>период + сводка + данные</small></button>
  <textarea id="out" readonly style="display:none;width:100%;height:90px;margin-top:8px;font:12px monospace"></textarea>
 </div>
 <div class="card"><h3>Резервная копия</h3>
  <button class="btn" id="svJSON">Сохранить резерв (JSON)</button>
  <button class="btn" id="imp">Загрузить резерв</button>
  <input type="file" id="file" accept=".json" style="display:none">
  <div class="mut" style="margin-top:6px" id="bk"></div><div class="mut">Данные хранятся только на этом телефоне. Делай резерв раз в месяц.</div>
 </div>
 <div class="card"><h3>Категории</h3>
  <div class="seg" id="ctypes"></div><div id="catList"></div>
  <div class="add"><input id="ce" placeholder="🙂" style="width:64px;text-align:center"><input id="cn" placeholder="Название"><button class="btn" id="ca" style="width:auto;border:none;padding:0 12px;color:var(--ac)">+</button></div>
 </div>
</section>
</div>
<div class="tabs" id="tabs"></div><div id="toast"></div><div id="undo"></div>
<script src="app.js"></script></body></html>
